services:
  # Backend API Service
  - type: web
    name: cv-builder-backend
    env: node
    region: oregon
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/user
    envVars:
      - key: NODE_VERSION
        value: 18.17.0
      - key: PORT
        value: 3000
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: PUPPETEER_SKIP_CHROMIUM_DOWNLOAD
        value: true
      - key: PUPPETEER_EXECUTABLE_PATH
        value: /usr/bin/chromium-browser
    buildFilter:
      paths:
        - backend/**

  # MongoDB Database (Optional - use MongoDB Atlas instead)
  # Note: Render doesn't offer free MongoDB, use MongoDB Atlas free tier
